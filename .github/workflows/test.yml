name: Test
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev]

# 댓글 쓰기 권한을 부여
permissions:
  contents: read
  pull-requests: write

jobs:
  unit-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v7

      - name: pnpm 설치 및 설정
        uses: pnpm/action-setup@v4

      - name: Node.js 설치 및 설정
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Jest 실행
        run: pnpm test

  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v7

      - name: pnpm 설치 및 설정
        uses: pnpm/action-setup@v4

      - name: Node.js 설치 및 설정
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Playwright Browsers 설치
        run: pnpm exec playwright install --with-deps

      - name: Playwright tests 실행
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v7

      - name: pnpm 설치 및 설정
        uses: pnpm/action-setup@v4

      - name: Node.js 설치 및 설정
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Chromatic 빌드
        id: chromatic_build
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # 변경사항이 있을 때 빌드를 실패(exit code 1)로 만들어 머지를 차단
          exitZeroOnChanges: false
          # 변경된 파일과 관련된 스토리만 테스트하여 빌드 속도를 최적화
          onlyChanged: true

      # 변경사항이 있을 때 항상 PR 코멘트를 남김
      - name: Comment PR with Chromatic results
        if: always() && steps.chromatic_build.outputs.changeCount != '0'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: "chromatic-review" # 여러 번 실행되어도 코멘트를 하나로 유지(업데이트)
          message: |
            ### 🎨 UI Review (Chromatic)

            | 결과 | 상세 내용 |
            | :--- | :--- |
            | 🚀 **Storybook Preview** | [미리보기 바로가기](${{ steps.chromatic_build.outputs.storybookUrl }}) |
            | 🛠 **Build Details** | [Chromatic 빌드 리포트](${{ steps.chromatic_build.outputs.buildUrl }}) |

            > **알림:** 시각적 변경 사항이 발견되면 리뷰어가 Chromatic에서 승인해야 머지가 가능합니다.
