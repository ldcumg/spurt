name: Deploy

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  pull_request:
    types: closed
    branches: [main, dev]

jobs:
  # dev 브랜치에 merge될 때 preview 배포
  deploy-preview:
    if: ${{ github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'dev'}}

    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 불러오기
        uses: actions/checkout@v7

      - name: pnpm 설치 및 설정
        uses: pnpm/action-setup@v4

      - name: Node.js 설치 및 설정
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: Vercel CLI 설치
        run: pnpm add -g vercel@latest

      - name: Vercel Preview 환경 설정 가져오기
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: 프로젝트 빌드
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel preview 배포
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  # dev 브랜치에서 main 브랜치로 merge될 때 production 배포
  deploy-production:
    if: ${{github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.base.ref == 'main'}}

    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 불러오기
        uses: actions/checkout@v7

      - name: pnpm 설치 및 설정
        uses: pnpm/action-setup@v4

      - name: Node.js 설치 및 설정
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: Vercel CLI 설치
        run: pnpm add -g vercel@latest

      - name: Vercel Production 환경 설정 가져오기
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 프로젝트 빌드
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel production 배포
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
